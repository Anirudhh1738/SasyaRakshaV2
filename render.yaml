services:
  - type: web
    name: sasyaraksha
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: agriguard-images
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_AI_URL
        sync: false
